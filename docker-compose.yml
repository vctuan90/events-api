services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: straumann_postgres
    environment:
      POSTGRES_DB: straumann_event_db
      POSTGRES_USER: straumann
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - straumann_network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: straumann_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - straumann_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: straumann_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://straumann:password@postgres:5432/straumann_event_db
      - DATABASE_URL_SYNC=postgresql://straumann:password@postgres:5432/straumann_event_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-super-secret-jwt-key-change-this-in-production
      - DEBUG=True
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - straumann_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    container_name: straumann_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./uploads:/var/www/uploads
    depends_on:
      - api
    networks:
      - straumann_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  straumann_network:
    driver: bridge 