services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: straumann_postgres
    environment:
      POSTGRES_DB: straumann_event_db
      POSTGRES_USER: straumann
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - straumann_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U straumann -d straumann_event_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: straumann_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - straumann_network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  straumann_network:
    driver: bridge 